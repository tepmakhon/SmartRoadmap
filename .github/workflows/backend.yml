name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: roadmap
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: smart_roadmap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roadmap -d smart_roadmap_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://roadmap:ci-only-password@localhost:5432/smart_roadmap_test
      JWT_SECRET_KEY: ci-only-secret-for-an-isolated-ephemeral-test-database
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m compileall -q app alembic
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q
      - run: python tests/run_postgres.py
      - run: python tests/check_migrations.py
      - run: docker build -t smart-roadmap-api .
      - name: Verify running containers
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('.env.docker').write_text('POSTGRES_PASSWORD=isolated-compose-ci-password\nJWT_SECRET_KEY=isolated-compose-ci-secret-long-enough-for-testing\nAPI_PORT=8001\n')
          PY
          docker compose --env-file .env.docker up --build -d --wait
          python backend/tests/smoke_docker.py
          python backend/tests/concurrency_docker.py
      - name: Stop test containers
        if: always()
        working-directory: .
        run: docker compose --env-file .env.docker stop
