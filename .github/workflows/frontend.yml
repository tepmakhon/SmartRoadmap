name: Frontend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production containers
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('.env.docker').write_text('POSTGRES_PASSWORD=isolated-frontend-ci-password\nJWT_SECRET_KEY=isolated-frontend-ci-secret-long-enough-for-testing\nAPI_PORT=8001\nFRONTEND_PORT=3000\n')
          PY
          docker compose --env-file .env.docker up --build -d --wait
      - name: Test real browser journeys through Nginx
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-results
          path: |
            frontend/playwright-report
            frontend/test-results/*.png
          retention-days: 7
      - name: Stop test containers
        if: always()
        working-directory: .
        run: docker compose --env-file .env.docker stop
