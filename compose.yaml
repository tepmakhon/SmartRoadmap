name: smart-roadmap

x-api: &api
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://roadmap:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/smart_roadmap
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
    ENVIRONMENT: ${ENVIRONMENT:-development}
    CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1"]}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smart_roadmap
      POSTGRES_USER: roadmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmap -d smart_roadmap"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
